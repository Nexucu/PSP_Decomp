plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moppi.flower.vulkan'
    compileSdk 34

    defaultConfig {
        applicationId 'com.moppi.flower.vulkan'
        minSdk 26          // Vulkan 1.0 requiere API 24+; 26 deja margen
        targetSdk 34
        versionCode 1
        versionName '1.0'

        ndk {
            // Vulkan está en todos los ABI modernos; arm64-v8a es el
            // principal en dispositivos actuales.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
